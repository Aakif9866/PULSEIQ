# Render Blueprint: Render dashboard → New → Blueprint → this repo.
# Free plan: the backend sleeps after 15 min idle (first request ~1 min);
# the static frontend never sleeps. Database stays on Neon.
# If Render gives a service a suffixed URL (name taken), update
# VITE_API_URL and CORS_ORIGINS below to match, and redeploy both.
services:
  - type: web
    name: pulseiq-aakif-api
    runtime: docker
    plan: free
    branch: feature/pulseiq-v2-roadmap
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # R2, so uploads survive free-tier sleeps and redeploys. The
      # endpoint is derived from R2_ACCOUNT_ID; never the public r2.dev URL.
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: pulse-iq
      # ponytail: free instance has 512 MB RAM. A 50 MB CSV measured ~611 MB
      # peak (app 156 + parse/profile ~455), so 25 here; 50 needs a paid plan.
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_DAILY_TOKEN_QUOTA_PER_USER
        value: "30000"
      # App-wide cap, under Groq free tier's 200k/day, so many sign-ups
      # can't drain the shared budget.
      - key: AI_DAILY_TOKEN_QUOTA_GLOBAL
        value: "180000"
      # Render's edge appends the real client IP to X-Forwarded-For; the
      # rate limiter reads that entry, which a client can't spoof.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DEMO_USER_EMAIL
        value: demo@pulseiq.dev
      - key: CORS_ORIGINS
        value: '["https://pulseiq-aakif.onrender.com"]'

  - type: web
    name: pulseiq-aakif
    runtime: static
    branch: feature/pulseiq-v2-roadmap
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pulseiq-aakif-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://pulseiq-aakif-api.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
