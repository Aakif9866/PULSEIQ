services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - pulseiq_uploads:/app/data/uploads
    # No command override — the image's own Dockerfile CMD already runs
    # migrations then uvicorn (and respects $PORT, defaulting to 8000
    # when nothing sets it, exactly as here).

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pulseiq_uploads:
