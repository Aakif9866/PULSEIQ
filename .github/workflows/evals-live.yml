name: Evals (live model)

# Manual only. A live run spends real, daily-capped API quota — on Groq's
# free tier the whole account gets 200,000 tokens/day, and one full
# 51-question run can use most of that (docs/EVALS.md). Running it on
# every push would starve the deployed app. The per-PR CI job covers
# everything that doesn't need the model.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of questions (blank = all 51)"
        required: false
        default: "5"
      sleep:
        description: "Seconds between questions (rate-limit pacing)"
        required: false
        default: "30"

jobs:
  live-evals:
    name: Live evals against the real model
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      AI_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Require the API key secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add a GROQ_API_KEY repository secret to run live evals."
            exit 1
          fi

      - name: Run evals
        # Inputs arrive via env, never interpolated straight into the
        # script — GitHub's documented guard against script injection.
        env:
          EVAL_LIMIT: ${{ inputs.limit }}
          EVAL_SLEEP: ${{ inputs.sleep }}
        run: |
          case "$EVAL_LIMIT" in ''|*[!0-9]*) LIMIT_ARGS=() ;; *) LIMIT_ARGS=(--limit "$EVAL_LIMIT") ;; esac
          case "$EVAL_SLEEP" in ''|*[!0-9.]*) EVAL_SLEEP=30 ;; esac
          python evals/runner.py "${LIMIT_ARGS[@]}" --sleep "$EVAL_SLEEP" --out evals/results/ci_run.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/ci_run.json
          if-no-files-found: warn
